name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.1.0
      with:
        python-version: '3.13'
    - run: make init
    - run: make check
    - run: make test

  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      data: ${{ steps.filter.outputs.data }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          data:
            - 'db/arabterm.sql.gz'
          code:
            - '!db/arabterm.sql.gz'
            - '!**/*.md'
            - '!gadget/**'
            - '!.github/workflows/gadget.yml'

  deploy-code:
    needs: [test, changes]
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.changes.outputs.code == 'true'))
    runs-on: ubuntu-latest
    concurrency:
      group: toolforge-deploy-code
      cancel-in-progress: false
    steps:
    - uses: appleboy/ssh-action@v1
      with:
        host: login.toolforge.org
        username: forzagreen
        key: ${{ secrets.TOOLFORGE_SSH_PRIVATE_KEY }}
        # SSH fingerprints: https://wikitech.wikimedia.org/wiki/Help:SSH_Fingerprints/login.toolforge.org
        fingerprint: SHA256:BOuOp0PJ5hHLM5YD30nCLAETdO6VpzCPvTqOU/dKNTc
        request_pty: true
        command_timeout: 15m
        script: |
          become wikitermbase bash << 'EOF'
          set -euo pipefail

          echo "[DEPLOY] Starting build"
          toolforge build start https://github.com/forzagreen/wikitermbase
          sleep 5

          echo "[DEPLOY] Polling build status..."
          ok=0
          for i in $(seq 1 90); do
            status=$(toolforge build show --json 2>/dev/null | jq -r '.build.status // "unknown"')
            echo "  [$i/90] status: $status"
            case "$status" in
              ok) ok=1; break ;;
              failed|error|cancelled|timeout)
                echo "[DEPLOY] BUILD FAILED with status: $status"
                toolforge build show
                exit 1
                ;;
              running|unknown|"") sleep 10 ;;
              *) sleep 10 ;;
            esac
          done

          [ "$ok" = "1" ] || { echo "[DEPLOY] Build poll timed out after 15 minutes"; exit 1; }

          echo "[DEPLOY] Build succeeded; restarting webservice"
          toolforge webservice buildservice restart
          echo "[DEPLOY] Done"
          EOF

  deploy-db:
    needs: [test, changes]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: toolforge-deploy-db
      cancel-in-progress: false
    steps:
    - uses: appleboy/ssh-action@v1
      with:
        host: login.toolforge.org
        username: forzagreen
        key: ${{ secrets.TOOLFORGE_SSH_PRIVATE_KEY }}
        # SSH fingerprints: https://wikitech.wikimedia.org/wiki/Help:SSH_Fingerprints/login.toolforge.org
        fingerprint: SHA256:BOuOp0PJ5hHLM5YD30nCLAETdO6VpzCPvTqOU/dKNTc
        request_pty: true
        command_timeout: 30m
        script: |
          become wikitermbase bash << 'EOF'
          set -euo pipefail

          echo "[DB] Syncing the checkout with main"
          cd ~/wikitermbase
          # The checkout is a deploy mirror: match origin/main exactly, so that
          # a leftover file (e.g. a dump downloaded by hand) can't block the
          # update. Ignored files (var/) are kept.
          git fetch origin main
          git reset --hard origin/main

          echo "[DB] Importing db/arabterm.sql.gz"
          gzip -t db/arabterm.sql.gz
          gunzip -c db/arabterm.sql.gz | mariadb --defaults-file="$HOME/replica.my.cnf" -h tools.db.svc.wikimedia.cloud s55953__arabterm

          echo "[DB] Import complete"
          EOF

  wikidata-stats:
    # Copy /api/v1/stats to Wikidata (Q133800945), where ويكيبيديا:مسرد_الويكي
    # reads its figures. Runs after each DB import, and on "Run workflow" to
    # re-sync by hand; waits for deploy-code so it doesn't hit the restart.
    #
    # The edit is made by a one-off Toolforge job, not from the runner:
    # Wikimedia globally blocks the Azure ranges GitHub's runners use
    # (globalblocking-blockedtext-range), and Toolforge's own addresses aren't.
    # The bot password lives in Toolforge envvars (WIKIDATA_USERNAME /
    # WIKIDATA_PASSWORD), so GitHub never holds it. The job runs the image
    # deploy-code builds; `--wait` returns the job's exit code.
    needs: [deploy-code, deploy-db]
    if: |
      !cancelled() && !contains(needs.*.result, 'failure') &&
      github.ref == 'refs/heads/main' &&
      (needs.deploy-db.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: wikidata-stats
      cancel-in-progress: false
    steps:
    - uses: appleboy/ssh-action@v1
      with:
        host: login.toolforge.org
        username: forzagreen
        key: ${{ secrets.TOOLFORGE_SSH_PRIVATE_KEY }}
        # SSH fingerprints: https://wikitech.wikimedia.org/wiki/Help:SSH_Fingerprints/login.toolforge.org
        fingerprint: SHA256:BOuOp0PJ5hHLM5YD30nCLAETdO6VpzCPvTqOU/dKNTc
        request_pty: true
        command_timeout: 20m
        script: |
          become wikitermbase bash << 'EOF'
          set -uo pipefail

          # A job left over from an interrupted run would block the name.
          toolforge jobs delete wikidata-stats >/dev/null 2>&1 || true

          echo "[WIKIDATA] Running the stats job"
          status=0
          toolforge jobs run wikidata-stats \
            --image tool-wikitermbase/tool-wikitermbase:latest \
            --command "python -u backend/wikidata_stats.py" \
            --wait 900 || status=$?

          # The job's output reaches the log store a few seconds after it ends.
          logs=""
          for i in $(seq 1 12); do
            logs=$(toolforge jobs logs wikidata-stats 2>/dev/null) && [ -n "$logs" ] && break
            sleep 5
          done
          echo "${logs:-(no logs from the job)}"

          toolforge jobs delete wikidata-stats >/dev/null 2>&1 || true
          echo "[WIKIDATA] Job exit code: $status"
          exit "$status"
          EOF
