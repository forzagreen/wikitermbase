name: Refresh DB dump from arabterm

on:
  repository_dispatch:
    types: [arabterm-data-updated]
  workflow_dispatch:
    inputs:
      arabterm_sha:
        description: "arabterm commit SHA (optional, info only)"
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.WIKITERMBASE_REFRESH_PAT }}

      - name: Regenerate dump
        run: |
          make download_dump
          make fix_dump

      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.WIKITERMBASE_REFRESH_PAT }}
          branch: auto/update-dump-${{ github.event.client_payload.arabterm_sha || github.event.inputs.arabterm_sha || github.run_id }}
          commit-message: "chore: refresh DB dump from arabterm@${{ github.event.client_payload.arabterm_sha || github.event.inputs.arabterm_sha || 'manual' }}"
          title: "chore: refresh DB dump from arabterm@${{ github.event.client_payload.arabterm_sha || github.event.inputs.arabterm_sha || 'manual' }}"
          body: |
            Auto-generated from a data change in [forzagreen/arabterm](https://github.com/forzagreen/arabterm/commit/${{ github.event.client_payload.arabterm_sha || github.event.inputs.arabterm_sha }}).

            Ran `make download_dump && make fix_dump` against arabterm `main`. Review the diff to `db/arabterm.sql` and merge to trigger the production DB import.
          add-paths: |
            db/arabterm.sql
