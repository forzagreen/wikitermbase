# yaml-language-server: $schema=https://gitlab.wikimedia.org/repos/cloud/toolforge/components-api/-/raw/main/openapi/tool-config-schema.json?ref_type=heads
source_url: https://raw.githubusercontent.com/forzagreen/wikitermbase/main/toolforge.yaml
components:
  web:
    build:
      repository: https://github.com/forzagreen/wikitermbase
      ref: main
    run:
      command: web
      port: 8000
      mount: none
      replicas: 1
      health_check_http: /api/v1/stats
