name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v8.1.0
      with:
        python-version: '3.13'
    - run: make init
    - run: make check
    - run: make test

  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      data: ${{ steps.filter.outputs.data }}
    steps:
    - uses: actions/checkout@v6
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          data:
            - 'db/arabterm.sql'
          code:
            - '!db/arabterm.sql'
            - '!**/*.md'

  deploy-code:
    needs: [test, changes]
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.changes.outputs.code == 'true'))
    runs-on: ubuntu-latest
    concurrency:
      group: toolforge-deploy-code
      cancel-in-progress: false
    steps:
    - uses: appleboy/ssh-action@v1
      with:
        host: login.toolforge.org
        username: forzagreen
        key: ${{ secrets.TOOLFORGE_SSH_PRIVATE_KEY }}
        fingerprint: SHA256:BOuOp0PJ5hHLM5YD30nCLAETdO6VpzCPvTqOU/dKNTc
        request_pty: true
        command_timeout: 15m
        script: |
          become wikitermbase bash << 'EOF'
          set -euo pipefail

          echo "[DEPLOY] Starting build"
          toolforge build start https://github.com/forzagreen/wikitermbase
          sleep 5

          echo "[DEPLOY] Polling build status..."
          ok=0
          for i in $(seq 1 90); do
            status=$(toolforge build show --json 2>/dev/null | jq -r '.build.status // "unknown"')
            echo "  [$i/90] status: $status"
            case "$status" in
              ok) ok=1; break ;;
              failed|error|cancelled|timeout)
                echo "[DEPLOY] BUILD FAILED with status: $status"
                toolforge build show
                exit 1
                ;;
              running|unknown|"") sleep 10 ;;
              *) sleep 10 ;;
            esac
          done

          [ "$ok" = "1" ] || { echo "[DEPLOY] Build poll timed out after 15 minutes"; exit 1; }

          echo "[DEPLOY] Build succeeded; restarting webservice"
          toolforge webservice buildservice restart
          echo "[DEPLOY] Done"
          EOF

  deploy-db:
    needs: [test, changes]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: toolforge-deploy-db
      cancel-in-progress: false
    steps:
    - uses: appleboy/ssh-action@v1
      with:
        host: login.toolforge.org
        username: forzagreen
        key: ${{ secrets.TOOLFORGE_SSH_PRIVATE_KEY }}
        fingerprint: SHA256:BOuOp0PJ5hHLM5YD30nCLAETdO6VpzCPvTqOU/dKNTc
        request_pty: true
        command_timeout: 30m
        script: |
          become wikitermbase bash << 'EOF'
          set -euo pipefail

          echo "[DB] Pulling latest code from main"
          cd ~/wikitermbase
          git pull --ff-only origin main

          echo "[DB] Importing db/arabterm.sql"
          mariadb --defaults-file="$HOME/replica.my.cnf" -h tools.db.svc.wikimedia.cloud s55953__arabterm < db/arabterm.sql

          echo "[DB] Import complete"
          EOF
