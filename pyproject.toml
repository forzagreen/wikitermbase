[project]
name = "wikitermbase"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "a2wsgi",
    "arabterm @ git+https://github.com/forzagreen/arabterm.git",
    "fastapi",
    "pandas",
    "pymysql",
    "sentry-sdk[fastapi]",
    "sqlalchemy",
]

[dependency-groups]
dev = [
    "ipykernel",
    "pytest",
    "ruff",
    "uvicorn[standard]",
]
