    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the saved colour scheme before first paint to avoid a flash.
      // Keep in sync with src/theme.js.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark' && t !== 'auto') {
            var legacy = localStorage.getItem('darkMode');
            t = legacy === 'true' ? 'dark' : legacy === 'false' ? 'light' : 'auto';
          }
          var dark =
            t === 'dark' ||
            (t === 'auto' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#1f2937' : '#ffffff');
        } catch (e) {}
      })();
    </script>
